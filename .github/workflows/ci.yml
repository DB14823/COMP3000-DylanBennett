name: CI
on:
  push:
  pull_request:

jobs:
  packages:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Install tools for architecture check
        run: brew install jq
      - name: Architecture check and package tests
        run: scripts/check-local.sh packages

  app:
    runs-on: xcode-27
    needs: packages
    steps:
      - uses: actions/checkout@v4
      - name: Build app for simulator
        run: scripts/check-local.sh app
